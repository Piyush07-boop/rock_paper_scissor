<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project3.css">
</head>
<body>
    <h1>ROCK - PAPER - SCISSOR</h1>
    <!-- choices-->
     <div class="choices">
        <div class="choice" id="rock">
            <img src="img_rock.jpg">
        </div>

        <div class="choice" id="paper">
            <img src="paper_img.svg" alt="Paper">
        </div>

        <div class="choice" id="scissor">
            <img src="scissor_img.png">
        </div>
     </div>

     <!--after choices score-->
     <div class="scoreboard">
        <!--scoreboard "user and computer"-->
        <div class="score">
            <p id="user-score"> 0 </p>
            <p> you </p>
        </div>

        <div class="score">
            <p id="comp-score"> 0 </p>
            <p> System </p>
        </div>
     </div>

     <!--MSG CONTAINER/ BOX-->
     <div class="msg-container">
        <p  id="msg"> play your move </p>
     </div>
    <script src="project3.js"></script>
</body>
</html>
